<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบอัปโหลดไฟล์ (Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- กล่องฟอร์มอัปโหลด -->
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md mb-6">
    <div class="text-center mb-6">
      <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">Netlify + Supabase Connected</span>
      <h2 class="text-2xl font-bold text-slate-800 mt-2">ส่งไฟล์เข้าระบบ</h2>
      <p class="text-sm text-slate-500">ทดสอบเชื่อมต่อฐานข้อมูลให้เห็นเป็นรูปเป็นร่าง</p>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ส่ง / แผนก</label>
      <input type="text" id="uploaderName" placeholder="เช่น สมชาย (ฝ่ายขาย)" 
             class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-1">เลือกไฟล์</label>
      <input type="file" id="fileInput" 
             class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-lg">
    </div>

    <button id="uploadBtn" onclick="testSubmit()" 
            class="w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-emerald-700 transition duration-200 shadow-md">
      ทดสอบส่งข้อมูลเข้า Supabase
    </button>

    <div id="status" class="mt-4 text-center text-sm font-medium"></div>
  </div>

  <!-- กล่องแสดงประวัติจาก Supabase -->
  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
    <h3 class="text-lg font-bold text-slate-800 mb-3">📋 ประวัติการส่งล่าสุด (ดึงจาก Supabase)</h3>
    <ul id="historyList" class="divide-y divide-slate-200 text-sm text-slate-600">
      <li class="py-2 text-center text-slate-400">กำลังโหลดข้อมูล...</li>
    </ul>
  </div>

  <script>
    // ====================================================
    // ⚠️ นำค่าจาก Supabase ของคุณมาใส่ในเครื่องหมายคำพูดตรงนี้
    // ====================================================
    const SUPABASE_URL = 'https://wabbwmoeuxszibgzolzx.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhYmJ3bW9ldXhzemliZ3pvbHp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyOTA0MDcsImV4cCI6MjEwNzg2NjQwN30.jTJ2-totk_qnMm753-4zKNo2WuPEARWP9UYKd5zet98';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ฟังก์ชันส่งข้อมูลเข้า Supabase
    async function testSubmit() {
      const fileInput = document.getElementById('fileInput');
      const uploaderName = document.getElementById('uploaderName').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('uploadBtn');

      if (!uploaderName || fileInput.files.length === 0) {
        status.innerHTML = "<span class='text-red-500'>⚠️ กรุณากรอกชื่อและเลือกไฟล์ก่อนครับ</span>";
        return;
      }

      const file = fileInput.files[0];
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      try {
        // บันทึกชื่อคนส่งและชื่อไฟล์ลงตาราง file_uploads ใน Supabase
        const { error } = await supabase
          .from('file_uploads')
          .insert([{ 
            uploader_name: uploaderName, 
            file_name: file.name, 
            drive_url: 'รอเชื่อมต่อ Google Drive ในขั้นต่อไป' 
          }]);

        if (error) throw error;

        status.innerHTML = "<span class='text-emerald-600'>✅ บันทึกลง Supabase สำเร็จ!</span>";
        fileInput.value = "";
        loadHistory(); // โหลดรายการด้านล่างใหม่ทันที
      } catch (err) {
        status.innerHTML = `<span class='text-red-500'>❌ Error: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.innerText = "ทดสอบส่งข้อมูลเข้า Supabase";
      }
    }

    // ฟังก์ชันดึงข้อมูลจาก Supabase มาโชว์บนหน้าเว็บ
    async function loadHistory() {
      const list = document.getElementById('historyList');
      const { data, error } = await supabase
        .from('file_uploads')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(5);

      if (error) {
        list.innerHTML = `<li class="py-2 text-red-500">โหลดข้อมูลไม่สำเร็จ: ${error.message}</li>`;
        return;
      }

      if (data.length === 0) {
        list.innerHTML = `<li class="py-2 text-center text-slate-400">ยังไม่มีข้อมูลในระบบ</li>`;
        return;
      }

      list.innerHTML = data.map(item => `
        <li class="py-2.5 flex justify-between items-center">
          <div>
            <p class="font-semibold text-slate-800">👤 ${item.uploader_name}</p>
            <p class="text-xs text-slate-500">📄 ไฟล์: ${item.file_name}</p>
          </div>
          <span class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600">บันทึกแล้ว</span>
        </li>
      `).join('');
    }

    // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
    loadHistory();
  </script>
</body>
</html>
